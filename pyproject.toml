[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockwise"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["scipy>=1.11", "SQLAlchemy>=2.0", "alembic>=1.13", "pydantic>=2.0", "psycopg[binary]>=3.1", "openpyxl>=3.1", "fastapi>=0.115", "uvicorn[standard]>=0.30", "PyJWT>=2.9", "argon2-cffi>=23.1", "python-multipart>=0.0.9", "email-validator>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["stockwise*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
