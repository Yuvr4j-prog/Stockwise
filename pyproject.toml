[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockwise-stage1"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["scipy>=1.11", "SQLAlchemy>=2.0", "alembic>=1.13", "pydantic>=2.0", "psycopg[binary]>=3.1", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["stockwise*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
