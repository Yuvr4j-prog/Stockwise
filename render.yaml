services:
  - type: web
    name: stockwise-demo-api
    runtime: python
    repo: https://github.com/Yuvr4j-prog/Stockwise
    branch: main
    rootDir: .
    region: singapore
    plan: free
    buildCommand: python -m pip install .
    startCommand: sh scripts/start_backend.sh
    healthCheckPath: /api/v1/health/db
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockwise-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGIN
        value: https://stockwise-demo-web.onrender.com
      - key: MAX_UPLOAD_BYTES
        value: "10485760"

  - type: web
    name: stockwise-demo-web
    runtime: node
    repo: https://github.com/Yuvr4j-prog/Stockwise
    branch: main
    rootDir: frontend
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build && mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/static
    startCommand: node .next/standalone/server.js
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BACKEND_URL
        value: https://stockwise-demo-api.onrender.com

databases:
  - name: stockwise-demo-db
    plan: free
    region: singapore
